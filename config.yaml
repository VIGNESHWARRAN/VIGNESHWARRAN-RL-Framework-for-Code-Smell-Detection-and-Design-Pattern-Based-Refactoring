paths:
  data_dir: "data/mlcq"
  processed_dir: "data/processed"
  results_dir: "data/results"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

dataset:
  mlcq_csv: "data/mlcq/mlcq.csv"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  use_synthetic: false
  n_synthetic: 4077
  nosmell_ratio: 3.0  # NoSmell instances are downsampled to (nosmell_ratio * largest smell class
                       # count) instead of a 1:1 match. 3.0 keeps clean code at ~3x the biggest
                       # smell class, so the agent still sees enough clean code to avoid
                       # over-flagging healthy code at test time. Set to 1.0 to restore the
                       # old 1:1 behavior.

smells:
  classes: ["GodClass", "FeatureEnvy", "LongMethod", "DataClass", "NoSmell"]
  n_classes: 5

semantic:
  model_name: "microsoft/graphcodebert-base" #"./graphcodebert-base" 
  embedding_dim: 768
  max_length: 512
  use_cache: true
  cache_dir: "data/processed/embeddings_cache"

graph:
  node_types: ["class", "method", "field", "parameter"]
  edge_types: ["CONTAINS", "CALLS", "USES", "INHERITS", "ACCESSES_FIELD"]

ck_metrics:
  features: ["wmc", "dit", "noc", "rfc", "cbo"]
  n_features: 5

data_usage:
  features: ["n_field_accesses", "n_method_calls", "n_external_objects",
             "field_access_ratio", "method_call_ratio", "data_usage_density"]
  n_features: 6

gcn:
  hidden_dim: 128
  output_dim: 128
  num_layers: 2
  dropout: 0.1

dqn:
  hidden_layers: [256, 128, 64]
  learning_rate: 0.0005
  batch_size: 128
  replay_buffer_size: 50000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 150000   # global_step increments once per training instance per episode;
                                 # set this to roughly (instances_per_episode * ~50) so epsilon
                                 # decays over ~50 episodes instead of <1. Adjust once you know
                                 # your actual train-set size (len(train_ds)).
  target_update_freq: 1000
  max_episodes: 200
  warmup_steps: 100  # 200
  gamma: 0.0  # 0.0 because it's a single-step episodic task

gcn_pretrain:
  epochs: 50
  learning_rate: 0.001
  batch_size: 32
  checkpoint_freq: 10

experiments:
  variants:
    - name: "Experiment A"
      description: "CK metrics + graph topology only"
      use_ck: true
      use_semantic: false
      use_data_usage: false
    - name: "Experiment B"
      description: "CK metrics + semantic embeddings"
      use_ck: true
      use_semantic: true
      use_data_usage: false
    - name: "Experiment C"
      description: "CK metrics + semantic + data usage"
      use_ck: true
      use_semantic: true
      use_data_usage: true

training:
  checkpoint_freq: 50
  log_freq: 10
  eval_freq: 50

reward:
  correct_smell: 2.0        # agent correctly identifies an actual smell (any of the 4 smell classes)
  correct_nosmell: 0.2      # agent correctly identifies clean code
  incorrect_smell: -1.0     # agent picks the wrong smell class (smell A mistaken for smell B)
  false_alarm: -0.5         # agent flags clean code (NoSmell) as a smell
  missed_smell: -1.0        # agent labels an actual smell as NoSmell

device: "auto"