paths:
  data_dir: "data/smellycode"
  processed_dir: "data/processed"
  results_dir: "data/results"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

dataset:
  dataset_type: "smellycode"
  smellycode_csv: "data/smellycode/SmellyCode++.csv"
  mlcq_csv: "data/mlcq/mlcq.csv"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  nosmell_ratio: 3.0  # downsample NoSmell to 3.0 * largest smell count
  data_version: "v4"  # Bumped to v4 to invalidate old caches and apply limits
  max_train_samples: 5000  # Cap training set at 5,000 for fast runs
  max_val_samples: 2000    # Cap validation set at 2,000 for fast eval
  max_test_samples: 2000   # Cap test set at 2,000 for fast test

smells:
  classes: ["GodClass", "FeatureEnvy", "LongMethod", "DataClass", "NoSmell"]
  n_classes: 5

patterns:
  classes: ["Strategy", "Observer", "Facade", "Mediator", "ExtractClass", "None"]
  n_classes: 6

semantic:
  model_name: "microsoft/graphcodebert-base"
  embedding_dim: 768
  max_length: 512
  use_cache: true
  cache_dir: "data/processed/embeddings_cache"

graph:
  node_types: ["class", "method", "field"]
  edge_types: ["CONTAINS", "CALLS", "ACCESSES_FIELD"]

gcn:
  hidden_dim: 128
  output_dim: 128
  num_layers: 2
  dropout: 0.1
  use_attention_pool: true
  use_residual: true
  use_layernorm: true
  encoder_type: "rgat"
  num_edge_types: 3
  num_heads: 4

dqn:
  gamma: 0.9                   # CRITICAL: non-zero for 2-step MDP
  hidden_layers: [256, 128, 64]
  learning_rate: 0.0005
  batch_size: 128
  weight_decay: 0.00001
  dqn_dropout: 0.2
  replay_buffer_size: 50000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 100000  # Scaled down to match 30-episode run
  target_update_freq: 1000
  max_episodes: 30             # Cap at 30 episodes for fast convergence
  warmup_steps: 500
  eval_freq: 10                # Eval val set every 10 episodes

gcn_pretrain:
  epochs: 40                   # Cap at 40 pretrain epochs (plenty for warm-start)
  learning_rate: 0.001
  batch_size: 32
  checkpoint_freq: 10

training:
  checkpoint_freq: 10
  log_freq: 5

device: "auto"